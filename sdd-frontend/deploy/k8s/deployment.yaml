apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdd-frontend
  labels:
    app.kubernetes.io/name: sdd-frontend
    app.kubernetes.io/part-of: sdd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sdd-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdd-frontend
        app.kubernetes.io/part-of: sdd
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: sdd-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: http://sdd-backend:8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            timeoutSeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            timeoutSeconds: 3
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: nginx-conf, emptyDir: {} }
