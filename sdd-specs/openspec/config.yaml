# Хранилище спецификаций продукта (OpenSpec store). Схема sdd — из дополнения openspec-sdd (../openspec-sdd):
# spec-driven + артефакт test-cases. Ставится поверх стандартного OpenSpec: openspec-sdd install; проверка: openspec-sdd doctor.
# Ведут: PO и скрам-мастер; правится редко.
schema: sdd

context: |
  Language: Russian
  Все артефакты пишутся на русском языке.
  Служебные маркеры формата OpenSpec НЕ переводятся: "## Why", "## What Changes",
  "## ADDED Requirements", "## MODIFIED Requirements", "## REMOVED Requirements",
  "### Requirement:", "#### Scenario:", "**WHEN**", "**THEN**", "**AND**", SHALL / MUST.

  Устройство: у фичи три слоя, и они лежат в разных местах.
  - Поведение (дельта spec.md), стык бэка и фронта (design.md изменения, contracts/*.yaml) и тест-кейсы
    (test-cases.md) — здесь, в sdd-specs. Это одно на фичу, общее для всех.
  - Реализация — в репозиториях приложений, у каждого своя: sdd-backend и sdd-frontend держат свой openspec/
    со схемой sdd-app и локальным изменением <изменение>-back / <изменение>-front (указатель, design, tasks).
    Хранилище они подключают только для чтения (references) и сюда не пишут.
  - Автотесты — в репозиториях приложений (зона ответственности бэкендеров и фронтендеров), по ID тест-кейсов отсюда.

  Приложения:
  - sdd-backend: C# / ASP.NET Core (.NET 10), Minimal API; тесты xUnit (tests/unit, tests/integration).
  - sdd-frontend: Angular 22 (standalone, zoneless, signals); unit Vitest (*.spec.ts рядом с кодом), E2E Playwright (tests/e2e).
  - Фронт ходит в бэк только по относительному пути /api/... (в кластере — nginx, локально — proxy.conf.json).

  Эксплуатация (для всех изменений):
  - Оба сервиса работают в Kubernetes в Linux-контейнерах; кластер разработчика может быть на Windows или Linux —
    решения не зависят от ОС хоста. Конфигурация только через переменные окружения. Сервисы без состояния.

  В спецификациях — только наблюдаемое поведение. Таблицы, классы, компоненты, библиотеки — в design.md приложения.

rules:
  proposal:
    - В разделе "What Changes" перечислить затронутые приложения (sdd-backend, sdd-frontend) и нужен ли новый контракт или версия контракта
    - Всегда указывать, что НЕ входит в изменение (Out of scope)
    - Описывать ценность для пользователя/бизнеса, а не только техническую задачу
  specs:
    - Текст каждого требования содержит модальное слово SHALL или MUST, например "Система SHALL (ДОЛЖНА) ..."
    - "Каждому сценарию давать стабильный ID в заголовке: #### Scenario: [<capability>-<NN>] <название>, например [auth-01] Успешный вход"
    - ID сценария никогда не меняется и не переиспользуется — по нему тест-кейсы и автотесты связаны со спецификацией
    - "Сценарии — наблюдаемое поведение (WHEN/THEN): тексты для пользователя дословно, без деталей реализации"
  design:
    - "Здесь только стык — то, о чём бэк и фронт должны договориться: кто что проверяет, формат ошибок и коды, асинхронность, время и форматы данных, версия контракта. Внутренности приложений (таблицы, запросы, классы, компоненты) — в design.md их локальных изменений, не здесь"
    - "Контракт API — файл contracts/<capability>-api.yaml (OpenAPI 3.1). При его изменении поднять info.version и указать новую версию в design.md; без изменения контракта так и написать: «контракт без изменений, версия X»"
    - Если изменение требует новых переменных окружения, портов, томов или сервисов — раздел "Развёртывание (Kubernetes)"
  test-cases:
    - "ID тест-кейса = ID сценария + '.<n>': auth-01.1, auth-01.2; заголовок кейса: ### [auth-01.1] Успешный вход по логину и паролю"
    - "Поле Automation начинается с имени репозитория, где будет автотест — это и есть владелец кейса: sdd-backend/tests/unit, sdd-backend/tests/integration (API), sdd-frontend/src/**/*.spec.ts (Vitest), sdd-frontend/tests/e2e (Playwright, /api мокается по контракту), smoke на стенде — тег @smoke"
    - "Для пользовательского сценария, затрагивающего оба приложения, нужен минимум один кейс на бэке (integration) и один на фронте (unit или e2e)"
    - "Тестовые данные брать из контракта contracts/*.yaml и design.md: конкретные значения полей, коды ответов, тексты сообщений"
    - "Уровень manual — только с причиной; такие кейсы выполняет QA на стенде после деплоя"
    - "В изменении — кейсы только для сценариев этого изменения (ADDED и MODIFIED). Для MODIFIED-сценария начинать с его кейсов из каталога openspec/specs/<capability>/test-cases.md: перенести их в test-cases.md изменения целиком (сохраняя ID), затем править, добавлять, удалять"
    - "Номера новых кейсов продолжают нумерацию сценария в каталоге; ID удалённого кейса больше не используется"
    - "Для REMOVED-сценариев кейсы не пишутся: в разделе Coverage перечислить кейсы каталога и автотесты, которые надо удалить"
  tasks:
    - "Это карта фичи по репозиториям, а не чек-лист разработчика: подробные задачи — в tasks.md локальных изменений приложений"
    - "Группы: '## 1. Спецификация и контракт' (уточнение пройдено, контракт и общий design согласованы, тест-кейсы на ревью QA), '## 2. Бэк (sdd-backend)', '## 3. Фронт (sdd-frontend)', '## 4. Приёмка и архивация'; приложения, которые изменение не затрагивает, не упоминать и нумерацию групп не пропускать"
    - "В группе приложения: задача «локальное изменение <репозиторий>/openspec/changes/<изменение>-back|-front закрыто и заархивировано» и задача «автотесты кейсов [ID, ...] зелёные» — ID берутся из test-cases.md по полю Automation"
    - "Группа приёмки: PO принял по сценариям; openspec-sdd trace-check --strict без ошибок; openspec archive <изменение>; openspec-sdd merge-test-cases <изменение>"

operations:
  apply:
    guidance:
      - "В хранилище код не пишется: задачи карты отмечаются, когда закрыто соответствующее локальное изменение приложения или пройден шаг приёмки"
      - "Реализация идёт в репозиториях приложений (/opsx:apply в sdd-backend и sdd-frontend по их локальным изменениям)"
  archive:
    guidance:
      - "Порядок: сначала локальные изменения в sdd-backend и sdd-frontend заархивированы, затем openspec-sdd trace-check --strict без ошибок, затем архив здесь"
      - "Сразу после openspec archive выполнить openspec-sdd merge-test-cases <изменение> — команда вливает test-cases.md изменения в каталоги openspec/specs/<capability>/test-cases.md (OpenSpec этого не делает), пересобирает Coverage и История и сама запускает trace-check. Каталоги руками не сливать"
      - "Затем просмотреть раздел Gaps каталога: снять пробелы, которые закрыло это изменение (команда их не снимает); после этого коммит sdd-specs"
