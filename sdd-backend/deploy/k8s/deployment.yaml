apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdd-backend
  labels:
    app.kubernetes.io/name: sdd-backend
    app.kubernetes.io/part-of: sdd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sdd-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdd-backend
        app.kubernetes.io/part-of: sdd
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: sdd-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ConnectionStrings__GridModels
              valueFrom:
                secretKeyRef: { name: sdd-grid-db, key: connection }
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: APP_VERSION   # system-status: версия сборки, видна пользователю
              value: dev
          readinessProbe:
            httpGet: { path: /healthz/ready, port: http }
            timeoutSeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz/live, port: http }
            timeoutSeconds: 5
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
